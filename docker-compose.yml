services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_COMPANY_NAME: ${NEXT_PUBLIC_COMPANY_NAME:-}
        NEXT_PUBLIC_ALLOWED_DOMAIN: ${NEXT_PUBLIC_ALLOWED_DOMAIN:-}
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      AUTH_TRUST_HOST: "true"
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET manquant dans le fichier .env}
    restart: unless-stopped
